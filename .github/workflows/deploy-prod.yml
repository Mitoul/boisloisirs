name: Build and publish production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create production environment
        run: |
          cat > .env.production <<'EOF'
          PUBLIC_SUPABASE_URL=${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY=${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          PUBLIC_CONTACT_EMAIL_FUNCTION=${{ secrets.PUBLIC_CONTACT_EMAIL_FUNCTION }}
          PUBLIC_SITE_URL=https://www.boisloisirs.be
          PUBLIC_SITE_ENV=production
          EOF

      - name: Build Astro
        run: npm run build

      - name: Publish dist to deploy-prod
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: deploy-prod
          publish_dir: ./dist
          force_orphan: true
          commit_message: "Deploy production from main ${{ github.sha }}"
